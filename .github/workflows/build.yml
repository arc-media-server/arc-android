# Tests and builds the release APK. To save Actions minutes it runs only when asked:
#   - Actions > Build > Run workflow. On main this also publishes a pre-release
#     (android-build-<run number>) on the Releases page; on another branch, a run artifact only.
#   - A pushed v* tag: a normal release with that version.
#   - A push whose commit message contains [build]: a run artifact only, never a release.
# A release is made only after the tests pass, and only with Arc's own signing key.
#
# Signing: with the repository secrets ARC_KEYSTORE_BASE64 (the keystore file, base64), and
# ARC_KEYSTORE_PASSWORD, ARC_KEY_ALIAS and ARC_KEY_PASSWORD, every build is signed with Arc's own
# key and installs over the last one. Without them it's signed with a throwaway debug key, so a
# new build has to replace an earlier one by uninstalling it first (README, "Builds on GitHub").
name: Build

on:
  workflow_dispatch:
  push:
    tags: ['v*']
    branches: ['**']

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v') || contains(github.event.head_commit.message, '[build]')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      version: ${{ steps.version.outputs.version }}
      signed: ${{ steps.key.outputs.signed }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: SDK packages
        # GitHub's Ubuntu image has the Android SDK (ANDROID_HOME); add the platform this app needs.
        run: |
          sdkmanager=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)
          yes | "$sdkmanager" --licenses > /dev/null || true
          "$sdkmanager" "platforms;android-37.0" "build-tools;36.0.0" > /dev/null
      - uses: gradle/actions/setup-gradle@v4
      - name: Version
        id: version
        # A v* tag gives its own version (v0.2.0 -> 0.2.0). Any other build is versionName's
        # major.minor (app/build.gradle.kts) plus the run number (0.1.57).
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then v="${GITHUB_REF_NAME#v}"
          else v="$(grep -oP 'versionName = .*?"\K[0-9]+\.[0-9]+' app/build.gradle.kts).${{ github.run_number }}"; fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "Version $v"
      - name: Arc's signing key
        id: key
        env:
          KEYSTORE: ${{ secrets.ARC_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE" ]; then
            echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/arc.keystore"
            echo "ARC_KEYSTORE_FILE=$RUNNER_TEMP/arc.keystore" >> "$GITHUB_ENV"
            echo "signed=true" >> "$GITHUB_OUTPUT"
            echo "Signing with Arc's key."
          else
            echo "::warning::No ARC_KEYSTORE_BASE64 secret: signed with a throwaway debug key, so uninstall an earlier build before installing this one."
          fi
      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest
      - name: Release APK
        env:
          ARC_KEYSTORE_PASSWORD: ${{ secrets.ARC_KEYSTORE_PASSWORD }}
          ARC_KEY_ALIAS: ${{ secrets.ARC_KEY_ALIAS }}
          ARC_KEY_PASSWORD: ${{ secrets.ARC_KEY_PASSWORD }}
        run: |
          ./gradlew --no-daemon assembleRelease -ParcVersionCode=${{ github.run_number }} -ParcVersionName=${{ steps.version.outputs.version }}
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk "out/arc-android-${{ steps.version.outputs.version }}.apk"
          cd out && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: arc-android-${{ steps.version.outputs.version }}
          path: out/
          retention-days: 30

  release:
    needs: build
    if: (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Only releases signed with Arc's key
        if: needs.build.outputs.signed != 'true'
        run: |
          echo "::error::No ARC_KEYSTORE_* secrets, so the APK has a throwaway debug key and isn't released. It's still on the run (Summary > Artifacts)."
          exit 1
      - uses: actions/download-artifact@v4
        with:
          name: arc-android-${{ needs.build.outputs.version }}
          path: release
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            gh release create "$GITHUB_REF_NAME" release/* --repo "$GITHUB_REPOSITORY" \
              --title "Arc for Android $VERSION" --generate-notes --verify-tag
          else
            gh release create "android-build-${{ github.run_number }}" release/* --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" --prerelease \
              --title "Arc for Android $VERSION (build ${{ github.run_number }})" --generate-notes
          fi
