# Tests and builds the release APK. To save Actions minutes it runs only when asked: from the
# Actions tab (Run workflow, on any branch), or for a push whose commit message contains [build].
# The APK is attached to the run (Summary > Artifacts).
#
# Signing: with the repository secrets ARC_KEYSTORE_BASE64 (the keystore file, base64), and
# ARC_KEYSTORE_PASSWORD, ARC_KEY_ALIAS and ARC_KEY_PASSWORD, every build is signed with Arc's own
# key and installs over the last one. Without them it's signed with a throwaway debug key, so a
# new build has to replace an earlier one by uninstalling it first (README, "Builds on GitHub").
name: Build

on:
  workflow_dispatch:
  push:

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[build]')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: SDK packages
        # GitHub's Ubuntu image has the Android SDK (ANDROID_HOME); add the platform this app needs.
        run: |
          sdkmanager=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)
          yes | "$sdkmanager" --licenses > /dev/null || true
          "$sdkmanager" "platforms;android-37.0" "build-tools;36.0.0" > /dev/null
      - uses: gradle/actions/setup-gradle@v4
      - name: Arc's signing key
        env:
          KEYSTORE: ${{ secrets.ARC_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE" ]; then
            echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/arc.keystore"
            echo "ARC_KEYSTORE_FILE=$RUNNER_TEMP/arc.keystore" >> "$GITHUB_ENV"
            echo "Signing with Arc's key."
          else
            echo "::warning::No ARC_KEYSTORE_BASE64 secret: signed with a throwaway debug key, so uninstall an earlier build before installing this one."
          fi
      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest
      - name: Release APK
        env:
          ARC_KEYSTORE_PASSWORD: ${{ secrets.ARC_KEYSTORE_PASSWORD }}
          ARC_KEY_ALIAS: ${{ secrets.ARC_KEY_ALIAS }}
          ARC_KEY_PASSWORD: ${{ secrets.ARC_KEY_PASSWORD }}
        run: |
          ./gradlew --no-daemon assembleRelease -ParcVersionCode=${{ github.run_number }}
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk "out/arc-android-${{ github.run_number }}.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: arc-android-${{ github.run_number }}
          path: out/arc-android-${{ github.run_number }}.apk
          retention-days: 30
